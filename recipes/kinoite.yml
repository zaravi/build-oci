---
name: kinoite
description: kinoite-main with modifications.

base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 44
modules:
  - from-file: base/common.yml
  - from-file: base/plasma.yml
  - from-file: base/amdgpu.yml
  - from-file: base/thefun.yml

  - type: os-release
    properties:
      PRETTY_NAME: Zavi OS

  - from-file: base/post-build.yml

  - type: files
    files:
      - source: system
        destination: /

  - type: signing
