---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    install:
      packages:
        - fcitx5-qt
        - fcitx5-gtk
        - fcitx5-chinese-addons
        - fcitx5-hangul
        - fcitx5-libthai
        - fcitx5-mozc
        - fcitx5-sayura
        - fcitx5-unikey
        - fcitx5-configtool
        - kcm-fcitx5
        - icoutils
        - kate
        - kf6-kimageformats
        - kio-admin
        - ksshaskpass
        - qt6-qtimageformats
        - plasma-oxygen
        - oxygen-icon-theme
      exclude:
        - ffmpegthumbnailer
        - plasma-discover-rpm-ostree
    remove:
      auto-remove: false
      packages:
        - ffmpegthumbnailer
        - plasma-discover-rpm-ostree
  - type: script
    snippets:
      - dnf5 versionlock add "qt6-*"

  - type: dnf
    install:
      packages:
        - git
        - cmake
        - extra-cmake-modules
        - gcc-g++
        - kf6-kwindowsystem-devel
        - plasma-workspace-devel
        - libplasma-devel
        - qt6-qtbase-private-devel
        - qt6-qtbase-devel
        - kwin-devel
        - kf6-knotifications-devel
        - kf6-kio-devel
        - kf6-kcrash-devel
        - kf6-ki18n-devel
        - kf6-kguiaddons-devel
        - libepoxy-devel
        - kf6-kglobalaccel-devel
        - kf6-kcmutils-devel
        - kf6-kconfigwidgets-devel
        - kf6-kdeclarative-devel
        - kdecoration-devel
        - wayland-devel
        - libdrm-devel
        - rpm-build

  - type: script
    snippets:
      - |
        set -euo pipefail
        git clone https://github.com/xarblu/kwin-effects-better-blur-dx
        cd kwin-effects-better-blur-dx
        mkdir build && cd build
        cmake .. -DCMAKE_INSTALL_PREFIX=/usr
        make -j$(nproc)
        make install
        cd /
        rm -rf /kwin-effects-better-blur-dx

  - type: dnf
    remove:
      packages:
        - git
        - cmake
        - extra-cmake-modules
        - gcc-g++
        - kf6-kwindowsystem-devel
        - plasma-workspace-devel
        - libplasma-devel
        - qt6-qtbase-private-devel
        - qt6-qtbase-devel
        - kwin-devel
        - kf6-knotifications-devel
        - kf6-kio-devel
        - kf6-kcrash-devel
        - kf6-ki18n-devel
        - kf6-kguiaddons-devel
        - libepoxy-devel
        - kf6-kglobalaccel-devel
        - kf6-kcmutils-devel
        - kf6-kconfigwidgets-devel
        - kf6-kdeclarative-devel
        - kdecoration-devel
        - wayland-devel
        - libdrm-devel
        - rpm-build
